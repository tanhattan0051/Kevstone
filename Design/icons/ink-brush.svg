<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep espresso ground -->
    <linearGradient id="ks_ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2018"/>
      <stop offset="0.55" stop-color="#20160f"/>
      <stop offset="1" stop-color="#130c08"/>
    </linearGradient>
    <!-- Warm glow behind the ink -->
    <radialGradient id="ks_glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#6b4a24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a2817" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3a2817" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft base vignette for depth -->
    <radialGradient id="ks_vign" cx="0.5" cy="1" r="0.9">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <!-- Squircle top sheen -->
    <radialGradient id="ks_topLight" cx="0.5" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Ivory-to-gold ink -->
    <linearGradient id="ks_ink" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbf3dd"/>
      <stop offset="0.42" stop-color="#eacf86"/>
      <stop offset="0.78" stop-color="#cca04a"/>
      <stop offset="1" stop-color="#a5762c"/>
    </linearGradient>
    <!-- Wet sheen along the top of the stroke -->
    <linearGradient id="ks_sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </linearGradient>
    <!-- Vermilion seal -->
    <linearGradient id="ks_seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c94b3b"/>
      <stop offset="1" stop-color="#9c2c22"/>
    </linearGradient>
    <filter id="ks_inkShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="ks_sealShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="ks_squircle"><rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/></clipPath>
  </defs>

  <!-- ==== Canvas ==== -->
  <g clip-path="url(#ks_squircle)">
    <rect width="1024" height="1024" fill="url(#ks_ground)"/>
    <rect width="1024" height="1024" fill="url(#ks_glow)"/>
    <rect width="1024" height="1024" fill="url(#ks_vign)"/>

    <!-- ==== Hero brushstroke: calligraphic dấu ngã (tilde), tapered brush ends ==== -->
    <g filter="url(#ks_inkShadow)">
      <path fill="url(#ks_ink)" d="
        M 268 518 C 306 460 364 418 430 412 C 492 406 528 440 556 478
        C 600 538 662 516 758 452 C 668 560 602 566 556 514
        C 518 466 480 458 426 476 C 374 492 326 536 268 518 Z"/>
      <path fill="url(#ks_sheen)" opacity="0.55" d="
        M 282 510 C 314 466 362 434 430 428 C 486 422 522 448 550 480
        C 544 456 512 432 458 434 C 398 436 326 476 282 510 Z"/>
    </g>

    <!-- Tone dot (dấu nặng) -->
    <circle cx="390" cy="602" r="27" fill="url(#ks_ink)" filter="url(#ks_inkShadow)"/>

    <!-- ==== Vermilion seal (triện) with a negative-space keystone ==== -->
    <g filter="url(#ks_sealShadow)">
      <path fill="url(#ks_seal)" fill-rule="evenodd" d="
        M 703 700 h 130 a 30 30 0 0 1 30 30 v 130 a 30 30 0 0 1 -30 30 h -130 a 30 30 0 0 1 -30 -30 v -130 a 30 30 0 0 1 30 -30 Z
        M 736 743 h 64 l -9 96 h -46 Z"/>
      <path fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" d="M 736 743 h 64 l -9 96 h -46 Z"/>
    </g>

    <!-- Glassy top light + crisp inner rim -->
    <rect width="1024" height="1024" fill="url(#ks_topLight)"/>
    <rect x="1.5" y="1.5" width="1021" height="1021" rx="226.5" ry="226.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>
</svg>