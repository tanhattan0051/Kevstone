<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Keystone">
  <defs>
    <!-- Warm charcoal canvas: espresso base with a subtle upward warmth -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2119"/>
      <stop offset="0.55" stop-color="#1c140e"/>
      <stop offset="1" stop-color="#100a07"/>
    </linearGradient>
    <!-- Amber glow radiating from behind the stone -->
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#7a4a18" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#3d2712" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3d2712" stop-opacity="0"/>
    </radialGradient>
    <!-- Recessed bronze arch -->
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3623"/>
      <stop offset="0.5" stop-color="#3a2a1b"/>
      <stop offset="1" stop-color="#22160d"/>
    </linearGradient>
    <!-- Molten gold keystone, lit from above -->
    <linearGradient id="stone" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.34" stop-color="#f6bd62"/>
      <stop offset="0.7" stop-color="#e0913a"/>
      <stop offset="1" stop-color="#b1601f"/>
    </linearGradient>
    <!-- Side shading to round the stone -->
    <linearGradient id="stoneShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.32"/>
    </linearGradient>
    <!-- Top-light sheen across the whole icon -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft long shadow cast by the keystone -->
    <filter id="drop" x="-40%" y="-30%" width="180%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <!-- Gentle blur for the engraved groove shadow -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Squircle clip for the top-light overlay -->
    <clipPath id="squircle">
      <rect x="64" y="64" width="896" height="896" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect x="64" y="64" width="896" height="896" rx="228" ry="228" fill="url(#bg)"/>
  <g clip-path="url(#squircle)">
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>

    <!-- Arch: the structure the keystone locks together -->
    <path d="M 222 700 A 290 290 0 0 1 802 700 L 702 700 A 190 190 0 0 0 322 700 Z"
          fill="url(#arch)"/>
    <!-- Inner lip of the arch, carved highlight -->
    <path d="M 322 700 A 190 190 0 0 1 702 700"
          fill="none" stroke="#0d0805" stroke-width="6" stroke-opacity="0.6"/>
    <path d="M 222 700 A 290 290 0 0 1 802 700"
          fill="none" stroke="#6b4d30" stroke-width="4" stroke-opacity="0.5"/>

    <!-- KEYSTONE: wedge wider at top, apex of the arch -->
    <g filter="url(#drop)">
      <path d="M 433.1 405.4 A 305 305 0 0 1 590.9 405.4 L 557.3 531 A 175 175 0 0 0 466.7 531 Z"
            fill="url(#stone)"/>
    </g>
    <!-- Rounding shade on the wedge flanks -->
    <path d="M 433.1 405.4 A 305 305 0 0 1 590.9 405.4 L 557.3 531 A 175 175 0 0 0 466.7 531 Z"
          fill="url(#stoneShade)"/>
    <!-- Crisp top rim catching the light -->
    <path d="M 433.1 405.4 A 305 305 0 0 1 590.9 405.4"
          fill="none" stroke="#fff2cf" stroke-width="5" stroke-opacity="0.85" stroke-linecap="round"/>

    <!-- Dấu mũ (circumflex) carved into the stone face -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- engraved shadow -->
      <path d="M 474 490 L 512 444 L 550 490" filter="url(#soft)"
            stroke="#743d17" stroke-width="20" stroke-opacity="0.85"/>
      <!-- lower bevel catching light -->
      <path d="M 474 495 L 512 449 L 550 495"
            stroke="#ffe6ad" stroke-width="8" stroke-opacity="0.7"/>
    </g>

    <!-- Global top light -->
    <rect x="64" y="64" width="896" height="896" fill="url(#sheen)"/>
  </g>
</svg>